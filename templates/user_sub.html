<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اشتراک کاربر | {{ brand }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>body { background-color: #0b0e17; color: #e2e8f0; font-family: Tahoma, sans-serif; padding-top: 30px; }</style>
</head>
<body>
<div class="container" style="max-width: 600px;">
    <div class="card p-4 text-center" style="background-color: #151928; border: 1px solid #9d4edd; border-radius: 20px;">
        <img src="{{ logo }}" alt="Logo" class="mx-auto mb-3" height="50">
        <h3 class="fw-bold text-purple mb-1">{{ brand }}</h3>
        <p class="text-muted small mb-3">صفحه هوشمند دریافت اشتراک</p>

        <div class="bg-white p-3 d-inline-block mx-auto rounded-3 mb-3">
            <img src="/qr?text={{ sub_url }}" alt="QR" width="160" height="160">
        </div>

        <div class="text-start mb-3 small">
            <div class="d-flex justify-content-between mb-1">
                <span>مصرف: {{ used_gb }} GB</span>
                <span>کل: {{ total_gb }} GB</span>
            </div>
            <div class="progress bg-dark" style="height: 10px;">
                <div class="progress-bar bg-info" style="width: 12%;"></div>
            </div>
            <div class="text-muted mt-2">تاریخ بروزرسانی (ایران): {{ shamsi_date }}</div>
        </div>

        <div class="d-grid gap-2">
            <a href="{{ social.admin_telegram }}" target="_blank" class="btn btn-outline-info text-start"><i class="fab fa-telegram"></i> ارتباط با ادمین</a>
            <a href="{{ social.channel_telegram }}" target="_blank" class="btn btn-outline-primary text-start"><i class="fas fa-bullhorn"></i> کانال پمپ نت</a>
        </div>
    </div>
</div>
</body>
</html>
