<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پمپ نت | PompNet Pro Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0717;
            --bg-card: #140f2d;
            --accent: #8b5cf6;
            --border: #281e50;
            --text: #e2e8f0;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
        }
        .card-custom {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .text-purple { color: var(--accent); }
        .badge-active {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid #10b981;
        }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 card-custom">
            <h4 class="m-0 fw-bold text-purple"><i class="fa-solid fa-bolt me-2"></i> پنل مدیریت PompNet</h4>
            <span class="badge badge-active p-2"><i class="fa-solid fa-circle me-1"></i> فعال روی Railway</span>
        </header>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card card-custom p-3">
                    <div class="text-muted mb-2"><i class="fa-solid fa-microchip me-1"></i> مصرف CPU</div>
                    <h2 class="text-purple fw-bold" id="cpu">{{ stats.cpu }}%</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-custom p-3">
                    <div class="text-muted mb-2"><i class="fa-solid fa-memory me-1"></i> مصرف RAM</div>
                    <h2 class="text-purple fw-bold" id="ram">{{ stats.ram }}%</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-custom p-3">
                    <div class="text-muted mb-2"><i class="fa-solid fa-hard-drive me-1"></i> فضای دیسک</div>
                    <h2 class="text-purple fw-bold" id="disk">{{ stats.disk }}%</h2>
                </div>
            </div>
        </div>

        <div class="card card-custom p-4">
            <h5 class="fw-bold mb-3 text-purple"><i class="fa-solid fa-server me-2"></i> لیست سرویس‌ها</h5>
            <div class="table-responsive">
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>نام سرویس</th>
                            <th>نوع</th>
                            <th>پورت</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in services %}
                        <tr>
                            <td class="fw-bold">{{ s.name }}</td>
                            <td><span class="badge bg-secondary">{{ s.type }}</span></td>
                            <td><code>{{ s.port }}</code></td>
                            <td><span class="badge badge-active">{{ s.status }}</span></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const res = await fetch('/api/stats');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('cpu').innerText = data.cpu + '%';
                    document.getElementById('ram').innerText = data.ram + '%';
                    document.getElementById('disk').innerText = data.disk + '%';
                }
            } catch (e) {}
        }
        setInterval(updateStats, 3000);
    </script>
</body>
</html>
